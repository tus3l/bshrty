<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3EC">
<title>My skin — your daily skincare companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3EC; --cream-deep:#F1E2D3; --card:#FFFDFB;
  --rose:#C97B84; --rose-deep:#A85C68; --rose-pale:#F0D8DA;
  --brown:#5A3A32; --brown-deep:#3D2620; --ink:#402A24; --muted:#8C6E64;
  --gold:#C9A15A;
  --good:#5E8F58; --good-bg:#E7EFE3;
  --warn:#B86A2A; --warn-bg:#F6E6D6;
  --bad:#B5544A; --bad-bg:#F5DEDA;
  --line:#E7D6C9; --r:18px; --shadow:0 10px 30px -12px rgba(61,38,32,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Cairo,system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(180deg,var(--cream),#F6E8DC) fixed; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:22px;font-weight:800;color:var(--brown-deep);line-height:1.2}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--rose-deep)}
.icon-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}
.top-actions{display:flex;align-items:center;gap:8px;position:relative}
.lang-btn{height:40px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--brown)}
.lflag{width:24px;height:16px;border-radius:3px;display:block;flex:none;box-shadow:0 0 0 1px rgba(61,38,32,.15)}
.lang-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:40;min-width:178px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.lang-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;font-size:14px;font-weight:600;text-align:start}
.lang-menu button:hover{background:var(--cream)}
.lang-menu button.on{background:var(--rose-pale);color:var(--rose-deep)}
.lang-menu button .ic{margin-inline-start:auto;width:16px;height:16px}
[dir=rtl] .ic-chevron{transform:scaleX(-1)}
:lang(ko) body{font-family:Cairo,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}

/* stage rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.rail-item .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rail-item.done .dot{background:var(--good)}
.rail-item.active{background:var(--brown);color:#fff;border-color:var(--brown)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:2px 0 6px;font-size:18px;font-weight:800;color:var(--brown-deep)}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--brown-deep)}
.eyebrow{display:block;font-size:11.5px;font-weight:700;color:var(--rose-deep);margin-bottom:2px}
.sub{margin:0;color:var(--muted);font-size:13.5px;line-height:1.75}
.small{font-size:12px;color:var(--muted);line-height:1.7}

.weather{background:linear-gradient(145deg,#5A3A32,#3D2620);color:#F6E9DE;border:none}
.weather .eyebrow{color:var(--gold)}
.weather .sub{color:#E8D5C8}
.uv-row{display:flex;align-items:flex-end;gap:16px;margin:8px 0 4px}
.uv-big{font-size:46px;font-weight:800;line-height:1;color:#fff}
.uv-meta{font-size:13px;line-height:1.6}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--cream-deep);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14.5px;border:1px solid transparent;width:100%}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:hover{background:var(--rose-deep)}
.btn-dark{background:var(--brown);color:#fff}
.btn-outline{background:transparent;border-color:var(--line);color:var(--brown)}
.btn-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}

/* stages list */
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:8px}
.stage-num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rose-pale);color:var(--rose-deep);font-weight:800;flex:none}
.stage.done .stage-num{background:var(--good-bg);color:var(--good)}
.stage-body{flex:1;min-width:0}
.stage-body b{display:block;font-size:14.5px}
.stage-body span{font-size:12.5px;color:var(--muted)}

/* forms */
.field{margin-top:14px}
.field>label,.field-label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--brown)}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.input:focus{border-color:var(--rose)}
textarea.input{min-height:110px;resize:vertical;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}

/* quiz */
.opt{display:block;width:100%;text-align:start;padding:11px 14px;margin-top:8px;border-radius:13px;border:1px solid var(--line);background:#fff}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--rose);background:var(--rose-pale)}

/* camera */
.cam{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#2C1C17;margin-top:6px}
.cam.wide{aspect-ratio:4/3}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.cam.mirror video,.cam.mirror canvas{transform:scaleX(-1)}
.cam.live video,.cam.live canvas{display:block}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:#E8D5C8;font-size:13.5px;line-height:1.7}
.cam.live .cam-ph{display:none}
.cam-hint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(61,38,32,.78);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;text-align:center;display:none}
.cam.live .cam-hint:not(:empty){display:block}
.progress{margin-top:12px;display:none}
.progress.show{display:block}
.bar{height:8px;border-radius:99px;background:var(--cream-deep);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .2s}
.progress span{display:block;font-size:12px;color:var(--muted);margin-top:4px}

/* results */
.zone{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.zone:first-of-type{border-top:none}
.zone .sw{width:12px;height:12px;border-radius:50%;flex:none}
.zone div{flex:1}
.zone b{font-size:14px}
.zone p{margin:0;font-size:12.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.ring{--p:0;--c:var(--good);width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--cream-deep) 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px;font-weight:800}
.verdict{padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.7}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.flag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.flag p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.product{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
.product img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:var(--cream)}
.product b{display:block;font-size:14px}
.product span{font-size:12px;color:var(--muted)}
.result-item{display:block;width:100%;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}
.result-item b{display:block;font-size:13.5px}
.result-item span{font-size:12px;color:var(--muted)}
ul.list{margin:6px 0 0;padding:0 0 0 18px;font-size:13.5px;line-height:1.9}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.routine>div{background:var(--cream);border-radius:12px;padding:10px 12px}
.routine h4{margin:0 0 4px;font-size:13px;color:var(--rose-deep)}
.routine ol{margin:0;padding-inline-start:18px;font-size:12.5px;line-height:1.8}
@media (max-width:380px){.routine{grid-template-columns:1fr}}
.zsteps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.zsteps li{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:12px;background:var(--cream-deep)}
.zsteps li.cur{box-shadow:inset 0 0 0 2px var(--rose)}
.zsteps .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:700;flex:none}
.zsteps li.ok .st{background:var(--good);border-color:var(--good);color:#fff}
.zsteps .m{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.prot{display:grid;gap:9px;margin-top:12px}
.prot-row{display:grid;grid-template-columns:88px 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.prot-row b{text-align:end}
.prot-bar{height:10px;border-radius:999px;background:var(--cream-deep);overflow:hidden}
.prot-bar i{display:block;height:100%;border-radius:inherit;transition:width .4s}
.qual{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qual:empty{display:none}
.qual span{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--cream-deep);color:var(--muted);font-weight:600}
.qual span.ok{background:var(--good-bg);color:var(--good)}
.qual span.no{background:var(--bad-bg);color:var(--bad)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:10px}
.disclaimer{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.8;margin:18px 6px 0}
.link-btn{background:none;border:none;color:var(--rose-deep);font-weight:700;font-size:13px;padding:6px 0;text-decoration:underline}

/* My skin — analysing overlay */
.ai-overlay{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,var(--cream),#F6E8DC);display:grid;place-items:center;padding:16px;color:var(--ink);overflow:auto}
.ai-box{width:100%;max-width:380px;text-align:center}
.ai-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--rose-pale);color:var(--rose-deep);font-size:12px;font-weight:800;margin-bottom:14px}
.ai-stage{position:relative;margin:0 auto;border-radius:22px;overflow:hidden;background-size:cover;background-position:center;border:4px solid #fff;box-shadow:var(--shadow)}
.ai-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,25,20,.05),rgba(42,25,20,.2))}
.ai-scan{position:absolute;left:0;right:0;height:70px;z-index:2;background:linear-gradient(180deg,transparent,rgba(201,123,132,.35),transparent);border-bottom:2px solid rgba(240,216,218,.8);animation:aiScan 2.4s ease-in-out infinite alternate}
@keyframes aiScan{from{top:-70px}to{top:100%}}
.ai-lens{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:50%;z-index:3;background-repeat:no-repeat;border:3px solid #fff;box-shadow:0 0 0 4px rgba(201,123,132,.55),0 10px 24px rgba(0,0,0,.45);will-change:transform}
.ai-lens::after{content:"";position:absolute;width:34px;height:8px;border-radius:4px;background:#fff;right:-26px;bottom:-12px;transform:rotate(45deg)}
.ai-dot{position:absolute;z-index:2;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid var(--rose-pale);opacity:0;animation:aiDot 6.3s ease-out infinite}
@keyframes aiDot{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1.2)}30%{opacity:.9;transform:scale(1)}45%,100%{opacity:0}}
.ai-box h3{margin:18px 0 2px;font-size:20px;font-weight:800;color:var(--brown-deep)}
.ai-caption{margin:0;min-height:1.8em;font-size:14px;color:var(--muted);transition:opacity .25s}
.ai-caption.fade{opacity:0}
.ai-box .bar i{transition:width .6s ease}
.ai-steps{list-style:none;margin:0;padding:12px 14px;text-align:start;font-size:13px;display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ai-steps li{display:flex;align-items:center;gap:10px;color:var(--muted);opacity:.6}
.ai-steps li .st{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.ai-steps li.active{color:var(--brown);opacity:1}
.ai-steps li.active .st{border-color:var(--rose);border-top-color:transparent;animation:spin .8s linear infinite}
.ai-steps li.done{color:var(--brown);opacity:1}
.ai-steps li.done .st{background:var(--good);border-color:var(--good)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.ai-scan,.ai-dot{animation:none}}

/* My skin — result card */
.ai-card{border-color:var(--rose-pale);background:linear-gradient(180deg,#FFF8F5,var(--card) 140px)}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--rose),var(--gold))}
.ai-head b{display:block;font-size:17px;font-weight:800;color:var(--brown-deep)}
.ai-head span{font-size:12px;color:var(--muted)}
.ai-head>div:nth-child(2){flex:1}
.ai-thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow)}
.ai-intro{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--rose-deep)}
.ai-summary{margin:0;font-size:14.5px;line-height:1.85}
.ai-type{background:var(--cream);border-radius:14px;padding:12px;margin:12px 0}
.ai-type b{display:block;font-size:15.5px;color:var(--brown-deep);margin:2px 0}
.ai-type p{margin:0 0 6px;font-size:13px;color:var(--muted);line-height:1.7}
.ai-h{margin:16px 0 4px !important;font-size:14.5px !important}
.ai-routine{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px;line-height:1.7}
.ai-routine li{margin-bottom:6px}
.ai-routine b{display:block;font-weight:600}
.ai-routine span{font-size:12px;color:var(--muted)}
.ai-ings{display:grid;gap:10px;margin-top:14px}
.ai-ings .chips{gap:6px}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,253,251,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.bn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-size:10px;font-weight:600;color:var(--muted);min-width:0}
.bn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn.active{color:var(--rose-deep)}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(61,38,32,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:calc(100vh - 32px);overflow:auto}
.rep{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:8px}
.rep .ring{width:48px;height:48px}
.rep .ring b{width:38px;height:38px;font-size:12.5px}
.rep-body{flex:1;min-width:0}
.rep-body b{display:block;font-size:14px}
.rep-body span{font-size:12px;color:var(--muted)}
table.rep-t{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.rep-t th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:700;padding:4px}
.rep-t td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:top;line-height:1.45}
.modal h3{margin:2px 0 8px;font-size:17px;color:var(--brown-deep)}
.modal p{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted)}
.modal .btn{margin-top:10px}
.ai-glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.ai-glance div{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ai-glance span{font-size:11.5px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;background:var(--brown-deep);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 3c3.5 3 5.5 6.2 5.5 9.5A5.5 5.5 0 0 1 12 18a5.5 5.5 0 0 1-5.5-5.5C6.5 9.2 8.5 6 12 3Z"/></svg></div>
      <div><h1>My skin</h1><p>Your daily skincare companion</p></div>
    </div>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn" data-act="langMenu" aria-label="Language" aria-haspopup="true"></button>
      <div class="lang-menu" id="langMenu" hidden data-noi18n></div>
      <button class="icon-btn" id="homeBtn" data-act="go" data-v="home" aria-label="Home"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg></button>
    </div>
  </header>
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
  <p class="disclaimer">My skin is a guidance tool for everyday skincare and does not replace a dermatologist, especially if you have a chronic health condition. Camera results are approximate and depend on lighting.</p>
</div>
<nav class="bnav"><div class="bnav-in" id="bnav"></div></nav>
<div id="modalRoot"></div>

function loadScript(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = () => rej(new Error('script ' + src));
    document.head.appendChild(s);
  });
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

let toastTimer = 0;
function toast(msg){
  let el = $('#toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3500);
}
function modal(html){ $('#modalRoot').innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* =========================================================
   STAGES / NAV
========================================================= */
const STAGES = [
  {key:'medical',    label:'Medical profile',   short:'Profile'},
  {key:'skintype',   label:'Skin type',         short:'Skin type'},

  {key:'ingredient', label:'Ingredient check',  short:'Ingredients'},

function isDone(key){

  return !!({medical:state.medical, skintype:state.skinType, pore:poreDone, ingredient:state.ingredient, spf:state.spf})[key];
}

function goTo(v){

  const navItems = [{key:'home', short:'Home'}, ...STAGES];
  $('#bnav').innerHTML = navItems.map(s =>

  if(active) active.scrollIntoView({block:'nearest', inline:'center'});
}

/* =========================================================
   WEATHER / UV
========================================================= */
function uvLevel(uv){
  if(uv < 3)  return {label:'Low', cls:'good', advice:'Low risk, but sunscreen still helps if you will be outside for a long time.'};
  if(uv < 6)  return {label:'Moderate', cls:'warn', advice:`Apply SPF 30+ sunscreen 15 minutes before going out.`};
  if(uv < 8)  return {label:'High', cls:'bad', advice:`Use SPF 50 and reapply every 2 hours, with a hat and sunglasses.`};
  if(uv < 11) return {label:'Very high', cls:'bad', advice:`Avoid direct sun from 11 am to 3 pm as much as you can.`};
  return {label:'Extreme', cls:'bad', advice:`Stay in the shade as much as you can — skin can burn within minutes.`};
}

function fetchWeather(){
  if(!navigator.geolocation){ ui.weather = {status:'error', msg:'This browser does not support location.'}; return refreshWeather(); }
  ui.weather = {status:'loading'}; refreshWeather();
  navigator.geolocation.getCurrentPosition(async pos => {
    try{
      const {latitude:la, longitude:lo} = pos.coords;
      const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,uv_index&hourly=uv_index&daily=uv_index_max&timezone=auto&forecast_days=1`;
      const gUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=${I18N.lang}`;
      const [w, g] = await Promise.all([
        fetch(wUrl).then(r => { if(!r.ok) throw new Error('weather'); return r.json(); }),
        fetch(gUrl).then(r => r.ok ? r.json() : null).catch(() => null)
      ]);
      let uv = w.current && w.current.uv_index;
      if(uv == null && w.hourly){
        const hour = (w.current.time || '').slice(0, 13);
        const i = w.hourly.time.findIndex(x => x.startsWith(hour));
        uv = i >= 0 ? w.hourly.uv_index[i] : 0;
      }
      ui.weather = {
        status:'ready',
        uv: Math.round((uv || 0) * 10) / 10,
        temp: Math.round(w.current.temperature_2m),
        max: w.daily && w.daily.uv_index_max ? Math.round(w.daily.uv_index_max[0] * 10) / 10 : null,
        hourly: w.hourly ? {time:w.hourly.time, uv:w.hourly.uv_index} : null,
        place: g ? (g.city || g.locality || g.principalSubdivision || '') : ''
      };
    }catch(e){
      ui.weather = {status:'error', msg:'Could not load weather data, please try again.'};
    }
    refreshWeather();
  }, err => {
    ui.weather = {status:'error', msg: err.code === 1 ? 'Location permission was not granted.' : 'Could not find your current location.'};
    refreshWeather();
  }, {timeout:15000, maximumAge:600000});
}
function refreshWeather(){
  const el = $('#weatherCard');
  if(el) el.outerHTML = weatherCard();
  // feed the real UV forecast into the sunscreen fade model
  const w = ui.weather, L = state.spfLive;
  if(L && w.status === 'ready'){ L.hourly = w.hourly; L.uvMax = w.max; L.uvLive = true; save(); refreshLive(); }
}
function weatherCard(){
  const w = ui.weather;
  let body = '<span class="eyebrow">UV right now</span>';
  if(w.status === 'ready'){
    const lvl = uvLevel(w.uv);
    body += `
      <div class="uv-row">
        <div class="uv-big">${w.uv}</div>
        <div class="uv-meta"><span class="pill ${lvl.cls}">${lvl.label}</span><br>
          ${w.temp}° ${w.place ? '· ' + esc(w.place) : ''}${w.max != null ? ` · today’s peak ${w.max}` : ''}</div>
      </div>
      <p class="sub">${lvl.advice}</p>
      <div class="btn-row"><button class="btn btn-ghost" data-act="locate">${ic('pin', 'width:16px;height:16px')} Refresh</button></div>`;
  } else {
    const msg = w.status === 'loading' ? 'Finding your location and UV index…'
      : w.status === 'error' ? esc(w.msg)
      : `Turn on location to see the UV index and temperature where you are.`;
    body += `<p class="sub" style="margin:6px 0 4px">${msg}</p>
      <div class="btn-row"><button class="btn btn-ghost" data-act="locate" ${w.status === 'loading' ? 'disabled' : ''}>${ic('pin', 'width:16px;height:16px')} Use my current location</button></div>`;
  }
  return `<div class="card weather" id="weatherCard">${body}</div>`;
}

/* =========================================================
   SUNSCREEN REMINDER (works while the page is open)
========================================================= */
let reminderTimer = 0;
function armReminder(){
  clearTimeout(reminderTimer);
  const r = state.reminder;
  if(!r || r.fired) return;
  const ms = r.dueAt - Date.now();
  if(ms <= 0) return fireReminder();
  reminderTimer = setTimeout(fireReminder, Math.min(ms, 2147483000));
}
function fireReminder(){
  if(!state.reminder) return;
  state.reminder.fired = true; save();
  const body = `Reapply sunscreen now, especially on your nose, ears and neck.`;
  try{ if('Notification' in window && Notification.permission === 'granted') new Notification('Time to reapply sunscreen', {body}); }catch(e){}
  toast('⏰ ' + body);
  if(view === 'home' || view === 'spf') refreshReminder();
}
async function setReminder(mins){
  let perm = 'unsupported';
  if('Notification' in window){
    try{ perm = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission; }catch(e){}
  }
  state.reminder = {dueAt: Date.now() + mins * 60000, fired:false, perm};
  save(); armReminder(); refreshReminder();
  toast(`We’ll remind you in ${fmtMins(Math.round(mins))}`);
}
function cancelReminder(){ state.reminder = null; save(); clearTimeout(reminderTimer); refreshReminder(); }
function fmtRemaining(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? `${h} h ${mm} min` : `${mm} min`;
}
function reminderCard(){
  const r = state.reminder;
  if(!r) return '<div id="reminderBox"></div>';
  const inner = r.fired
    ? `<p class="sub">Time’s up — reapply sunscreen now.</p>
       <div class="btn-row"><button class="btn btn-primary" data-act="remind" data-v="120">Done — remind me in 2 hours</button><button class="btn btn-outline" data-act="cancelReminder">Stop</button></div>`
    : `<p class="sub">Next reapplication in <b data-countdown>${fmtRemaining(r.dueAt - Date.now())}</b>.
       ${r.perm !== 'granted' ? 'Notifications are off, so the reminder will only show inside the page.' : ''} The reminder works while the page is open.</p>
       <div class="btn-row"><button class="btn btn-outline" data-act="cancelReminder">Cancel reminder</button></div>`;
  return `<div class="card" id="reminderBox"><span class="eyebrow">${ic('bell', 'width:14px;height:14px;vertical-align:-2px')} Sunscreen reminder</span>${inner}</div>`;
}
function refreshReminder(){ const el = $('#reminderBox'); if(el) el.outerHTML = reminderCard(); }
setInterval(() => {
  const r = state.reminder;
  document.querySelectorAll('[data-countdown]').forEach(el => { if(r) el.textContent = fmtRemaining(r.dueAt - Date.now()); });
  if(view === 'spf' && smart.mode !== 'ar') refreshLive();
}, 30000);

/* =========================================================
   HOME
========================================================= */
const TYPE_INFO = {
  oily:       {label:'Oily',        desc:'High oil and shine, especially in the T-zone, with more visible pores.'},
  dry:        {label:'Dry',         desc:'Feels tight and may flake; needs rich moisture and barrier care.'},
  combination:{label:'Combination', desc:'Oily on the forehead, nose and chin; normal or dry on the cheeks.'},
  sensitive:  {label:'Sensitive',   desc:'Gets irritated or red easily; short, fragrance-free ingredient lists work best.'},
  normal:     {label:'Normal',      desc:'Balanced, without noticeable oiliness or dryness; a simple, steady routine works.'},
};
function routineFor(type){
  const preg = state.medical && state.medical.conditions.includes('Pregnancy or breastfeeding');
  const R = {
    oily:{am:['Gentle gel cleanser','Niacinamide serum','Light oil-free moisturiser','Lightweight SPF 30+ sunscreen'],
          pm:['Gel cleanser','Salicylic acid 2–3 times a week','Light moisturiser']},
    dry:{am:['Sulfate-free cream cleanser','Hyaluronic acid on damp skin','Ceramide-rich moisturiser','Moisturising SPF 30+ sunscreen'],
         pm:['Cream cleanser','Rich moisturiser or night balm','Lukewarm water instead of hot']},
    combination:{am:['Gentle cleanser','Niacinamide','Light moisturiser for the T-zone','SPF 30+ sunscreen'],
                 pm:['Gentle cleanser','Salicylic acid on the T-zone twice a week','Richer moisturiser for the cheeks']},
    sensitive:{am:['Fragrance-free cleanser','Moisturiser with few ingredients (ceramides, panthenol)','Mineral sunscreen (zinc oxide)'],
               pm:['Gentle cleanser','Soothing moisturiser','Patch-test any new product on a small area for 48 hours']},
    normal:{am:['Gentle cleanser','Antioxidant such as vitamin C','Light moisturiser','SPF 30+ sunscreen'],
            pm:['Gentle cleanser','Moisturiser', preg ? 'Avoid retinol while pregnant or breastfeeding' : 'Low-strength retinol (optional)']},
  };
  return R[type];
}

function stageStatus(key){
  if(key === 'medical' && state.medical) return `Age ${state.medical.age} · ${state.medical.conditions.join(', ') || 'None'}`;
  if(key === 'skintype' && state.skinType) return `${state.skinType.label} skin`;
  if(key === 'pore' && state.poreAI && state.poreAI.report.image_ok) return 'My skin · ' + esc(state.poreAI.report.pore_type);
  if(key === 'pore' && state.pore) return poreOverall(state.pore).text;
  if(key === 'ingredient' && state.ingredient) return `${state.ingredient.productName ? esc(state.ingredient.productName) + ' · ' : ''}${state.ingredient.flags.length ? state.ingredient.score + '/100' : 'Unrated'}`;
  if(key === 'spf' && state.spf) return `Coverage ${state.spf.coverage}%`;
  return 'Not started yet';
}

function summaryLines(){
  const L = [];
  const m = state.medical;
  if(m && m.risky && m.risky.length && m.supervised === false)
    L.push(`<li>You have ${esc(m.risky.join(', '))} without current medical follow-up — we recommend seeing a dermatologist before using treatment products.</li>`);
  if(m && m.conditions.includes('Pregnancy or breastfeeding'))
    L.push('<li>Because of pregnancy or breastfeeding: avoid retinoids and hydroquinone.</li>');
  if(state.skinType) L.push(`<li>Your skin is <b>${state.skinType.label}</b>: ${TYPE_INFO[state.skinType.raw].desc}</li>`);
  if(state.poreAI && state.poreAI.report.image_ok){
    const r = state.poreAI.report;
    L.push(`<li><b>My skin:</b> ${esc(r.pore_type)}${r.key_findings[0] ? ' — ' + esc(r.key_findings[0]) : ''}</li>`);
    if(r.see_doctor) L.push(`<li>We recommend seeing a dermatologist: ${esc(r.doctor_reason)}</li>`);
  } else if(state.pore){
    const bad = state.pore.zones.filter(z => z.cls === 'bad').map(z => z.name);
    L.push(`<li>${bad.length ? `Clear shine on: ${bad.join(', ')} — focus your cleanser and oil-control products there.` : 'The scan showed no strong oily shine.'}</li>`);
  }
  if(state.ingredient) L.push(`<li>Last product checked: ${state.ingredient.productName ? esc(state.ingredient.productName) + ' — ' : ''}${esc(state.ingredient.verdict.text)}</li>`);
  if(state.spf){
    const miss = state.spf.missed;
    L.push(`<li>Sunscreen coverage ${state.spf.coverage}%${miss.length ? ` — don’t forget: ${miss.join(', ')}` : ''}.</li>`);
  }
  return L;
}

function viewHome(){
  const done = STAGES.filter(s => isDone(s.key)).length;
  const lines = summaryLines();
  const routine = state.skinType ? routineFor(state.skinType.raw) : null;
  return `
    ${weatherCard()}
    ${reminderCard()}
    <div class="card">
      <span class="eyebrow">Your skin summary</span>
      <h2>At a glance</h2>
      ${lines.length ? `<ul class="list">${lines.join('')}</ul>`
        : `<p class="sub">You haven’t completed the medical profile or the skin type quiz yet. Start with step 1 to get accurate recommendations.</p>`}
    </div>
    ${routine ? `
    <div class="card">
      <span class="eyebrow">Your suggested routine</span>
      <h2>${state.skinType.label} skin routine</h2>
      <div class="routine">
        <div><h4>Morning</h4><ol>${routine.am.map(x => `<li>${x}</li>`).join('')}</ol></div>
        <div><h4>Evening</h4><ol>${routine.pm.map(x => `<li>${x}</li>`).join('')}</ol></div>
      </div>
    </div>` : ''}
    <div class="card">
      <span class="eyebrow">Five steps · ${done} of 5</span>
      <h2>Your skin journey</h2>
      <p class="sub">Complete each step for a full analysis tailored to your skin.</p>
      ${STAGES.map((s, i) => `
        <button class="stage${isDone(s.key) ? ' done' : ''}" data-act="go" data-v="${s.key}">
          <span class="stage-num">${isDone(s.key) ? ic('check', 'width:16px;height:16px') : i + 1}</span>

async function startCamera(video, facingMode){

}

function camErrorText(e){

const PORE_ZONES = [
  {key:'forehead', name:'Forehead',     lm:151, hint:() => `Hold still and look at the camera — checking your forehead`},
  {key:'nose',     name:'Nose',         lm:5,   hint:() => 'Checking your nose'},

  {key:'cheekL',   name:'Left cheek',   lm:280, hint:() => `Turn your head slightly to the right — checking your left cheek`},
  {key:'chin',     name:'Chin',         lm:199, hint:() => `Lift your chin slightly — checking your chin`},
];

const FALLBACK_POINTS = {forehead:{x:.5,y:.3}, nose:{x:.5,y:.5}, cheekR:{x:.37,y:.56}, cheekL:{x:.63,y:.56}, chin:{x:.5,y:.74}, r:.035};

let faceMeshPromise = null;
function getFaceMesh(){
  if(!faceMeshPromise){
    faceMeshPromise = withTimeout((async () => {
      await loadScript(FM_BASE + 'face_mesh.js');
      const fm = new FaceMesh({locateFile: f => FM_BASE + f});
      fm.setOptions({maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:.5, minTrackingConfidence:.5});
      await fm.initialize();
      return fm;
    })(), 25000).catch(e => { faceMeshPromise = null; throw e; });
  }
  return faceMeshPromise;

function landmarkPoints(lm){
  const pts = {r: Math.abs(lm[454].x - lm[234].x) * 0.07};
  PORE_ZONES.forEach(z => pts[z.key] = lm[z.lm]);
  return pts;
}

// Shine estimate: share of bright, low-saturation pixels (specular highlights from oil) in a patch.
function samplePatch(ctx, cx, cy, rad){
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const x0 = clamp(Math.round(cx - rad), 0, W - 1), y0 = clamp(Math.round(cy - rad), 0, H - 1);
  const w = clamp(Math.round(rad * 2), 2, W - x0), h = clamp(Math.round(rad * 2), 2, H - y0);
  const d = ctx.getImageData(x0, y0, w, h).data;
  const n = d.length / 4;
  let sum = 0;
  const L = new Float32Array(n), S = new Float32Array(n);
  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    L[j] = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    S[j] = mx ? (mx - mn) / mx : 0;
    sum += L[j];
  }
  const mean = sum / n;
  const thr = Math.max(0.72, mean + 0.18);
  let hi = 0;
  for(let j = 0; j < n; j++) if(L[j] > thr && S[j] < 0.28) hi++;
  return {mean, shine: hi / n};
}
function classifyShine(s){
  if(s > 0.09)  return {cls:'bad',  color:'#B5544A', note:'Clear oily shine'};
  if(s > 0.03)  return {cls:'warn', color:'#C9773B', note:'Moderate shine, needs care'};
  return {cls:'good', color:'#5E8F58', note:'Balanced surface, no excess shine'};
}
function poreOverall(p){
  const bad = p.zones.filter(z => z.cls === 'bad').length, warn = p.zones.filter(z => z.cls === 'warn').length;
  if(bad >= 2) return {cls:'bad', text:'High oil activity'};
  if(bad || warn >= 2) return {cls:'warn', text:'Moderate shine in some areas'};
  return {cls:'good', text:'Balanced skin'};
}

// Downscale to what the vision model actually uses (long edge ≤ 1568px) and re-encode as JPEG.
function encodeImage(src, w, h, maxEdge, quality){
  const s = Math.min(1, maxEdge / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

function setupAiSteps(runs){

    return;
  }
  if(ul.dataset.mode === 'single') return; // already set up
  ul.dataset.mode = 'single';
  ul.innerHTML = ['Checking the photo: pores, dark circles and pigmentation', 'Writing the report'].map((s, i) =>
    `<li data-i="${i}" class="${i === 0 ? 'active' : ''}"><span class="st"></span>${s}</li>`).join('');
  let ticks = 0;
  ai.creep = setInterval(() => {
    if(!$('#aiFill')) return clearInterval(ai.creep);

  const thumb = encodeImage(src, w, h, 220, 0.7);
  showAnalyzing(full, w / h);
  ai.ctl = new AbortController();
  try{
    const res = await fetch('/api/analyze-skin', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({image: full.split(',')[1], mediaType:'image/jpeg', profile:{medical:state.medical, skinType:state.skinType}, lang:I18N.lang}),
      signal: ai.ctl.signal
    });
    if(!res.ok || !res.body){
      let msg = '';
      try{ msg = (await res.json()).error; }catch(e){}
      if(!msg) msg = [404, 405, 501].includes(res.status)
        ? 'The analysis service is not available here — run the site with "npm start" and open http://localhost:3000.'
        : 'Could not reach the analysis service.';
      throw new Error(msg);
    }
    aiProgress(10);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', result = null;
    for(;;){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let nl;
      while((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if(!line) continue;
        const ev = JSON.parse(line);
        if(ev.type === 'start'){ setupAiSteps(ev.runs); }
        else if(ev.type === 'analysis'){ aiStep(ev.n - 1, 'done'); aiProgress(10 + ev.n * 22); }
        else if(ev.type === 'synthesizing'){ [0, 1, 2].forEach(i => aiStep(i, 'done')); aiStep(3, 'active'); aiProgress(78); }
        else if(ev.type === 'result'){ result = ev; }
        else if(ev.type === 'error'){ throw new Error(ev.message); }
      }
    }
    if(!result) throw new Error('The connection dropped before the analysis finished, please try again.');
    document.querySelectorAll('#aiSteps li').forEach(li => li.className = 'done');
    aiProgress(100);
    await new Promise(r => setTimeout(r, 600));
    state.poreAI = {report: result.report, runs: result.runs, thumb, at: Date.now()};
    save(); closeAnalyzing(); renderChrome();
    if(typeof saveAnalysis === 'function') saveAnalysis(state.poreAI, !!state.anPhoto);
    const box = $('#poreResult');
    if(box){ box.innerHTML = aiResultHtml() + (state.pore ? poreResultHtml() : ''); box.scrollIntoView({behavior:'smooth', block:'start'}); }
  }catch(e){
    if(e.name === 'AbortError'){ closeAnalyzing(); return; }
    aiFail(e.message || 'Something went wrong.');
  }finally{
    ai.ctl = null;
  }
}

async function startPore(){
  stopCamera();
  const token = session.token;
  const cam = $('#poreCam'), video = $('#poreVideo'), canvas = $('#poreCanvas');
  const ph = $('#porePh'), hint = $('#poreHint'), btn = $('#poreBtn');
  const prog = $('#poreProg'), fill = $('#poreFill'), txt = $('#poreTxt');
  btn.disabled = true;
  ph.querySelector('span').textContent = 'Starting camera…';
  try{ await startCamera(video, 'user'); }
  catch(e){ ph.querySelector('span').textContent = camErrorText(e); btn.disabled = false; return; }
  if(token !== session.token) return;
  cam.classList.add('live');
  hint.textContent = 'Loading the face tracking model…';

  let fm = null;
  try{ fm = await getFaceMesh(); }catch(e){ fm = null; }
  if(token !== session.token) return;

  const W = video.videoWidth, H = video.videoHeight;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const sc = Math.min(1, 480 / W);
  off.width = Math.round(W * sc); off.height = Math.round(H * sc);
  const octx = off.getContext('2d', {willReadFrequently:true});

  let landmarks = null, busy = false;
  if(fm) fm.onResults(r => { landmarks = (r.multiFaceLandmarks && r.multiFaceLandmarks[0]) || null; });

  const zones = PORE_ZONES.map(z => ({key:z.key, name:z.name, hint:z.hint, sum:0, n:0, ms:0}));
  let zi = 0, last = performance.now();
  prog.classList.add('show');

  const frame = now => {
    if(token !== session.token) return;
    const dt = Math.min(100, now - last); last = now;
    if(fm && !busy){ busy = true; fm.send({image:video}).catch(() => {}).finally(() => { busy = false; }); }
    octx.drawImage(video, 0, 0, off.width, off.height);
    ctx.clearRect(0, 0, W, H);

    const pts = fm ? (landmarks ? landmarkPoints(landmarks) : null) : FALLBACK_POINTS;
    if(!fm || !pts) drawOval(ctx, W, H);
    const z = zones[zi];
    if(!pts){
      hint.textContent = `Place your face inside the frame`;
    } else {
      const p = pts[z.key];
      const s = samplePatch(octx, p.x * off.width, p.y * off.height, Math.max(6, pts.r * off.width));
      if(s.mean < 0.2){
        hint.textContent = `Too dark — move somewhere brighter`;
      } else {
        z.sum += s.shine; z.n++; z.ms += dt;
        hint.textContent = z.hint() + (fm ? '' : ' (no tracking)');
      }
      zones.slice(0, zi).forEach(d => drawDot(ctx, pts[d.key].x * W, pts[d.key].y * H, classifyShine(d.shine).color));
      drawPulse(ctx, p.x * W, p.y * H, Math.max(14, pts.r * W * 1.6), now);
    }
    const pct = (zi + Math.min(1, z.ms / ZONE_MS)) / zones.length;
    fill.style.width = (pct * 100).toFixed(1) + '%';
    txt.textContent = `${Math.round(pct * 100)}% · zone ${zi + 1} of ${zones.length}: ${z.name}`;

    if(z.ms >= ZONE_MS){
      z.shine = z.n ? z.sum / z.n : 0;
      zi++;
      if(zi >= zones.length) return finishPore(zones, !fm);
    }
    session.raf = requestAnimationFrame(frame);
  };
  session.raf = requestAnimationFrame(frame);
}
function finishPore(zones, approx){
  stopCamera();
  state.pore = {zones: zones.map(z => ({key:z.key, name:z.name, shine:+z.shine.toFixed(4), cls:classifyShine(z.shine).cls})), approx, at:Date.now()};
  save(); renderChrome();
  $('#poreProg').classList.remove('show');
  $('#poreBtn').disabled = false;
  $('#porePh span').textContent = 'Scan complete ✓';
  $('#poreResult').innerHTML = poreResultHtml() + (state.poreAI ? aiResultHtml() : '');
  $('#poreResult').scrollIntoView({behavior:'smooth', block:'start'});
}
function drawOval(ctx, W, H){
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(2, W / 200); ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.ellipse(W / 2, H * .5, W * .26, H * .34, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function drawDot(ctx, x, y, color){
  ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
}
function drawPulse(ctx, x, y, r, now){
  const k = (Math.sin(now / 220) + 1) / 2;
  ctx.beginPath(); ctx.arc(x, y, r * (0.85 + 0.25 * k), 0, Math.PI * 2);
  ctx.lineWidth = 3; ctx.strokeStyle = `rgba(201,123,132,${0.6 + 0.4 * k})`; ctx.stroke();
}

  {label:'Parabens', level:'caution', names:['paraben'], reason:'A preservative that can cause allergy in some people.'},
  {label:'Salicylic acid', level:'good_oily', names:['salicylic acid'], reason:'Clears pores and suits oily skin; can dry out dry skin.'},
  {label:'Niacinamide', level:'good', names:['niacinamide'], reason:'Calms the skin and regulates oil.'},
  {label:'Hyaluronic acid', level:'good_dry', names:['hyaluronic','sodium hyaluronate'], reason:'A light humectant that draws water into the skin.'},
  {label:'Ceramides', level:'good_dry', names:['ceramide'], reason:'Strengthen the skin barrier and reduce moisture loss.'},
  {label:'Glycerin', level:'good', names:['glycerin','glycerol'], reason:'A gentle humectant that suits every skin type.'},
  {label:'Panthenol', level:'good', names:['panthenol'], reason:'Soothes and repairs irritated skin.'},
  {label:'Zinc oxide', level:'good', names:['zinc oxide'], reason:'A gentle mineral UV filter that suits sensitive skin.'},
  {label:'Vitamin C', level:'good', names:['ascorbic acid','ascorbyl','vitamin c'], reason:'An antioxidant that supports radiance.'},
  {label:'Aloe vera', level:'good', names:['aloe'], reason:'Soothing and lightly moisturising.'},
];

function analyzeIngredients(raw, productName){
  const text = raw.toLowerCase();
  const m = state.medical || {conditions:[], allergies:''};
  const skin = state.skinType ? state.skinType.raw : null;
  const sensitive = skin === 'sensitive' || ['Known skin allergy','Eczema','Rosacea'].some(c => m.conditions.includes(c));
  const preg = m.conditions.includes('Pregnancy or breastfeeding');
  const oilyish = skin === 'oily' || skin === 'combination';
  const dryish = skin === 'dry' || sensitive;

  let score = 100;
  const flags = [];
  ING_DB.forEach(it => {
    if(!it.names.some(n => text.includes(n.toLowerCase()))) return;
    let sev = 'ok', d = 0;
    switch(it.level){
      case 'irritant':    sev = sensitive ? 'avoid' : 'caution'; d = sensitive ? -22 : -8; break;
      case 'comedogenic': sev = oilyish ? 'caution' : 'ok';      d = oilyish ? -12 : -2;  break;
      case 'caution':     sev = 'caution'; d = sensitive ? -12 : -7; break;
      case 'pregnancy':   sev = preg ? 'avoid' : 'caution';      d = preg ? -35 : -6;    break;
      case 'good_oily':   sev = dryish ? 'caution' : 'ok';       d = oilyish ? 5 : dryish ? -4 : 1; break;
      case 'good_dry':    sev = 'ok'; d = dryish ? 5 : 2; break;
      case 'good':        sev = 'ok'; d = 3; break;
    }
    score += d;
    flags.push({name:it.label, reason:it.reason, sev});
  });

  // personal allergies typed in the medical profile
  (m.allergies || '').split(/[،,;\n]/).map(s => s.trim()).filter(s => s.length >= 3).forEach(a => {
    if(text.includes(a.toLowerCase())){ score -= 40; flags.unshift({name:a, reason:'Listed as an allergy in your medical profile.', sev:'avoid'}); }
  });

  score = clamp(Math.round(score), 10, 100);
  const order = {avoid:0, caution:1, ok:2};
  flags.sort((a, b) => order[a.sev] - order[b.sev]);
  const hasAvoid = flags.some(f => f.sev === 'avoid');
  let verdict;
  if(!flags.length) verdict = {cls:'warn', text:'We didn’t recognise any ingredient from our list — we can’t rate this product.'};
  else if(hasAvoid || score < 60) verdict = {cls:'bad', text:'Not recommended for you — it contains ingredients that conflict with your skin or condition.'};
  else if(score < 80) verdict = {cls:'warn', text:`Suitable with caution — patch-test it on a small area for 48 hours first.`};
  else verdict = {cls:'good', text:'Suits your skin, based on the ingredients we know.'};
  return {productName: productName || null, score, verdict, flags, matched: flags.length, at:Date.now()};
}

  const ingredients = p.ingredients_text_en || p.ingredients_text || p.ingredients_text_fr || '';
  ui.ing.product = {name:p.product_name || p.product_name_en || p.product_name_ar || '', brand:p.brands || '', img:p.image_front_small_url || '', code};
  ui.ing.text = ingredients;
  $('#productBox').innerHTML = productHtml(ui.ing.product);
  $('#ingText').value = ingredients;
  $('#searchResults').innerHTML = '';
  if(ingredients){ runAnalyze(); }
  else{
    toast('No ingredient list for this product in the database — paste it from the pack.');
    $('#ingText').focus();
  }
}
async function lookupBarcode(code){
  setIngStatus(`Barcode ${code} — searching…`);
  try{
    const r = await fetch(`${OBF}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,product_name_ar,brands,ingredients_text,ingredients_text_en,ingredients_text_ar,ingredients_text_fr,image_front_small_url`);
    const d = await r.json();
    if(d.status === 1 && d.product){ setIngStatus(`Product found (${code}).`); useProduct(d.product, code); }
    else setIngStatus(`Product ${code} isn’t in Open Beauty Facts. Try searching by name or paste the ingredients.`);
  }catch(e){ setIngStatus('Could not reach the product database.'); }
}
async function startBarcode(){
  const btn = $('#bcBtn');
  if(session.streams.length || session.zx){ stopCamera(); btn.textContent = 'Start scanner'; setIngStatus(''); return; }
  stopCamera();
  const token = session.token;
  const cam = $('#bcCam'), video = $('#bcVideo');
  btn.textContent = 'Stop scanner';
  setIngStatus('Starting camera…');
  const onCode = code => {
    if(token !== session.token) return;
    stopCamera(); btn.textContent = 'Start scanner';
    if(navigator.vibrate) navigator.vibrate(80);
    lookupBarcode(code);
  };
  try{
    let formats = ['ean_13','ean_8','upc_a','upc_e','code_128'];
    if('BarcodeDetector' in window){
      const supported = await BarcodeDetector.getSupportedFormats();
      formats = formats.filter(f => supported.includes(f));
    }
    if('BarcodeDetector' in window && formats.length){
      await startCamera(video, 'environment');
      if(token !== session.token) return;
      cam.classList.add('live');
      setIngStatus('Point the camera at the barcode…');
      const det = new BarcodeDetector({formats});
      let lastT = 0;
      const loop = async now => {
        if(token !== session.token) return;
        if(now - lastT > 250){
          lastT = now;
          try{ const c = await det.detect(video); if(c.length) return onCode(c[0].rawValue); }catch(e){}
        }
        session.raf = requestAnimationFrame(loop);
      };
      session.raf = requestAnimationFrame(loop);
    } else {
      await loadScript(ZXING_URL);
      if(token !== session.token) return;
      const reader = new ZXing.BrowserMultiFormatReader();
      session.zx = reader;
      cam.classList.add('live');
      setIngStatus('Point the camera at the barcode…');
      await reader.decodeFromConstraints({video:{facingMode:'environment'}}, video, res => { if(res) onCode(res.getText()); });
    }
  }catch(e){
    stopCamera(); btn.textContent = 'Start scanner';
    setIngStatus(camErrorText(e));
  }
}

/* ---------------------------------------------------------
   SMART SUNSCREEN CHECK
   1) "before" snapshot of every zone (tone, shine)
   2) guided application per zone: hand motion over the zone + change in
      specular shine / brightness / saturation vs the snapshot => ✅
   3) fade model: real UV index (Open-Meteo) × SPF × zone exposure,
      drawn live on the face mesh as a green / yellow / red AR overlay
--------------------------------------------------------- */
const SPF_AR_ZONES = [
  {key:'forehead', name:'Forehead',     my:'your forehead',    chip:'Forehead', lm:151, expo:1.15,
   hull:[109,10,338,297,299,337,151,108,69,67]},
  {key:'nose',     name:'Nose',         my:'your nose',        chip:'Nose',  lm:5,   expo:1.3,
   hull:[168,6,197,195,5,4,1,19,49,279,48,278,129,358,98,327,64,294]},
  {key:'cheekR',   name:'Right cheek',  my:'your right cheek', chip:'Cheeks', lm:50,  expo:1,
   hull:[116,117,118,119,100,36,205,187,123,50,147]},
  {key:'cheekL',   name:'Left cheek',   my:'your left cheek',  chip:'Cheeks', lm:280, expo:1,
   hull:[345,346,347,348,329,266,425,411,352,280,376]},
  {key:'chin',     name:'Chin',         my:'your chin',        chip:'Chin',  lm:199, expo:.85,
   hull:[18,200,199,175,152,148,176,377,400,201,421,83,313,32,262]},
];
const SPF_STATUS = {verified:'Confirmed by colour', glossy:'Confirmed by shine (clear sunscreen)', motion:'Hand application detected', manual:'Confirmed manually'};
const BASE_FRAMES = 30;     // analysed frames for the "before" reference
const AFTER_FRAMES = 12;    // analysed frames per "after" measurement
const PREP_MS = 1200;       // let auto-exposure settle before locking it
// decay per minute: everyday wear (sebum, touching ≈ 20% lost in 4h) + UV photodegradation
// calibrated so UV 6 outdoors for 2h leaves ≈ 40% (the usual "reapply every 2 hours")
const SPF_DECAY = {base: Math.log(1 / 0.8) / 240, uv: 0.0012};
const PROT_GOOD = 70, PROT_WEAK = 40;

function spfNumber(v){ return v === '15' ? 15 : v === '50+' ? 50 : 30; }
function protCls(p){
  if(p >= PROT_GOOD) return {cls:'good', color:'#5E8F58', rgb:'94,143,88',  label:'Strong'};
  if(p >= PROT_WEAK) return {cls:'warn', color:'#C99A2E', rgb:'217,169,59', label:'Weakening'};
  return {cls:'bad', color:'#B5544A', rgb:'200,70,60', label:'Reapply now'};
}

// ---- geometry ----
function convexHull(pts){
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if(p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for(const q of p){ while(lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i = p.length - 1; i >= 0; i--){ const q = p[i]; while(up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function scalePoly(poly, k){
  const c = poly.reduce((a, p) => ({x:a.x + p.x / poly.length, y:a.y + p.y / poly.length}), {x:0, y:0});
  return poly.map(p => ({x:c.x + (p.x - c.x) * k, y:c.y + (p.y - c.y) * k}));
}
function pointInPoly(p, poly){
  let inside = false;
  for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const a = poly[i], b = poly[j];
    if((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function zoneGeometry(lm){
  const r = Math.abs(lm[454].x - lm[234].x) * 0.07;
  const g = {};
  SPF_AR_ZONES.forEach(z => g[z.key] = {cx:lm[z.lm].x, cy:lm[z.lm].y, r, hull:convexHull(z.hull.map(i => lm[i]))});
  return g;
}
const FALLBACK_GEO = (() => {
  const g = {};
  SPF_AR_ZONES.forEach(z => g[z.key] = {cx:FALLBACK_POINTS[z.key].x, cy:FALLBACK_POINTS[z.key].y, r:FALLBACK_POINTS.r, hull:null});
  return g;
})();
// measurement cells = every Face Mesh landmark lying inside the zone (shrunk a little to stay off
// brows, hairline, nostrils and lips). Cells ride on the mesh, so "before" and "after" compare the
// exact same patch of skin even after the head moves.
function buildCells(lm){
  const out = {}, used = new Set();
  SPF_AR_ZONES.forEach(z => {
    const poly = scalePoly(convexHull(z.hull.map(i => lm[i])), .9);
    let idx = [];
    for(let i = 0; i < 468; i++) if(!used.has(i) && pointInPoly(lm[i], poly)) idx.push(i);
    if(idx.length < 6) idx = [...new Set([...idx, z.lm, ...z.hull])].filter(i => !used.has(i));
    idx.forEach(i => used.add(i));
    out[z.key] = idx;
  });
  return out;
}
const FALLBACK_CELLS = (() => {
  const o = {}, r = FALLBACK_POINTS.r;
  SPF_AR_ZONES.forEach(z => {
    const c = FALLBACK_POINTS[z.key]; o[z.key] = [];
    for(let i = -1; i <= 1; i++) for(let j = -1; j <= 1; j++) o[z.key].push({x:c.x + i * r * 1.1, y:c.y + j * r * 1.1});
  });
  return o;
})();
function zonePath(ctx, z, W, H){
  ctx.beginPath();
  if(z.hull && z.hull.length > 2){
    z.hull.forEach((p, i) => i ? ctx.lineTo(p.x * W, p.y * H) : ctx.moveTo(p.x * W, p.y * H));
    ctx.closePath();
  } else ctx.arc(z.cx * W, z.cy * H, z.r * W * 2, 0, Math.PI * 2);
}
function paintZone(ctx, z, W, H, rgb, alpha, lw){
  zonePath(ctx, z, W, H);
  ctx.fillStyle = `rgba(${rgb},${alpha})`; ctx.fill();
  if(lw){ ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${rgb},.95)`; ctx.stroke(); }
}
function dots(ctx, pts, W, H, color, r){
  ctx.fillStyle = color;
  pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, r, 0, Math.PI * 2); ctx.fill(); });
}

// ---- head pose (same pose as the reference = same lighting geometry) ----
function facePose(lm, w, h){
  const P = i => ({x:lm[i].x * w, y:lm[i].y * h});
  const L = P(234), R = P(454), T = P(10), B = P(152), N = P(1), E1 = P(33), E2 = P(263);
  const fw = Math.hypot(R.x - L.x, R.y - L.y), fh = Math.hypot(B.x - T.x, B.y - T.y);
  return {fw, fh, cx:(L.x + R.x) / 2, cy:(T.y + B.y) / 2,
    yaw:(N.x - (L.x + R.x) / 2) / fw, pitch:(N.y - (T.y + B.y) / 2) / fh, roll:Math.atan2(E2.y - E1.y, E2.x - E1.x)};
}
function avgPose(list){
  const o = {fw:0, fh:0, cx:0, cy:0, yaw:0, pitch:0, roll:0};
  list.forEach(p => { for(const k in o) o[k] += p[k] / list.length; });
  return o;
}
function poseDiff(a, b){ return {yaw:b.yaw - a.yaw, pitch:b.pitch - a.pitch, roll:b.roll - a.roll, scale:b.fw / a.fw}; }
// Tolerances are wide enough for a hand-held phone: the measured points ride on the face landmarks,
// so pose only matters for lighting geometry. `loose` (hysteresis) keeps an OK pose OK through small jitter.
const POSE_TOL = {yaw:.1, pitch:.1, roll:.15, near:.82, far:1.2};
function poseOk(d, loose){
  const k = loose ? 1.4 : 1;
  return Math.abs(d.yaw) < POSE_TOL.yaw * k && Math.abs(d.pitch) < POSE_TOL.pitch * k && Math.abs(d.roll) < POSE_TOL.roll * k
    && d.scale > 1 - (1 - POSE_TOL.near) * k && d.scale < 1 + (POSE_TOL.far - 1) * k;
}
function poseHint(d){
  if(d.scale <= POSE_TOL.near) return `Bring the phone a little closer (same distance as the first capture)`;
  if(d.scale >= POSE_TOL.far) return `Move the phone a little farther away (same distance as the first capture)`;
  if(Math.abs(d.roll) >= POSE_TOL.roll) return `Straighten your head`;
  if(Math.abs(d.pitch) >= POSE_TOL.pitch) return d.pitch > 0 ? `Lift your chin slightly` : `Lower your chin slightly`;
  return `Face the camera directly, like in the first capture`;
}
// pose gate with hysteresis + a short buzz when the pose locks in, so the user can feel it without reading
function poseGate(d){
  const was = smart.poseGood;
  const ok = poseOk(d, was);
  const now = performance.now();
  if(ok && !was && now - (smart.poseBuzzAt || 0) > 900){ buzz(35); smart.poseBuzzAt = now; }
  smart.poseGood = ok;
  return ok;
}
// haptics (Android Chrome; iOS Safari ignores navigator.vibrate)
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

// ---- colour science: sRGB -> linear -> CIE L*a*b* (D65) ----
const SRGB_LIN = new Float32Array(256).map((_, i) => { const c = i / 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); });
function lin2lab(r, g, b){
  const X = (.4124 * r + .3576 * g + .1805 * b) / .95047, Y = .2126 * r + .7152 * g + .0722 * b, Z = (.0193 * r + .1192 * g + .9505 * b) / 1.08883;
  const f = v => v > .008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
const labDist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);   // ΔE*76
const chroma = c => Math.hypot(c[1], c[2]);
function avgLab(list){
  const o = [0, 0, 0];
  list.forEach(c => { o[0] += c[0]; o[1] += c[1]; o[2] += c[2]; });
  return o.map(v => v / list.length);
}
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) * (v - m)))); };
const median = a => { if(!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };

// one analysed frame: Lab of every cell + specular share and gloss of each zone
function measureFrame(img, ptsByZone, rad, gain){
  const {data, width:w, height:h} = img;
  const out = {};
  let clip = 0, tot = 0;
  for(const z of SPF_AR_ZONES){
    const pts = ptsByZone[z.key], cells = new Array(pts.length), Ys = [], Ss = [];
    for(let c = 0; c < pts.length; c++){
      const cx = Math.round(pts[c].x), cy = Math.round(pts[c].y);
      let R = 0, G = 0, B = 0, n = 0;
      for(let y = Math.max(0, cy - rad); y <= Math.min(h - 1, cy + rad); y++)
        for(let x = Math.max(0, cx - rad); x <= Math.min(w - 1, cx + rad); x++){
          const i = (y * w + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2];
          const lr = SRGB_LIN[r], lg = SRGB_LIN[g], lb = SRGB_LIN[b];
          R += lr; G += lg; B += lb; n++;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          if(mx >= 250) clip++;
          tot++;
          Ys.push(.2126 * lr + .7152 * lg + .0722 * lb); Ss.push(mx ? (mx - mn) / mx : 0);
        }
      cells[c] = n ? lin2lab(Math.min(1, R / n * gain), Math.min(1, G / n * gain), Math.min(1, B / n * gain)) : null;
    }
    // exposure-independent shine: share of near-colourless pixels far brighter than the zone median,
    // and the bright-tail ratio p95/median (a fresh film reflects more light as specular highlights)
    const sorted = Float32Array.from(Ys).sort();
    const med = sorted[sorted.length >> 1] || 0, p95 = sorted[Math.floor(sorted.length * .95)] || 0;
    let spec = 0;
    for(let k = 0; k < Ys.length; k++) if(Ys[k] > med * 1.6 && Ss[k] < .3) spec++;
    const ok = cells.filter(Boolean);
    let tn = 0, ts = 0, ts2 = 0;
    for(let k = 0; k < Ys.length; k++) if(Ys[k] <= med * 1.6){ tn++; ts += Ys[k]; ts2 += Ys[k] * Ys[k]; }
    const tm = tn ? ts / tn : 0, tex = tm ? Math.sqrt(Math.max(0, ts2 / tn - tm * tm)) / tm : 0;
    out[z.key] = {cells, spec: Ys.length ? spec / Ys.length : 0, gloss: med ? p95 / med : 1, L: mean(ok.map(c => c[0])), tex};
  }
  out.clip = tot ? clip / tot : 0;
  return out;
}
// how much a zone's cells changed since the previous frame (a hand passing over it), minus global drift
function cellMotion(a, b){
  let s = 0, m = 0, k = 0;
  for(let i = 0; i < Math.min(a.cells.length, b.cells.length); i++){
    if(!a.cells[i] || !b.cells[i]) continue;
    const d = a.cells[i][0] - b.cells[i][0]; s += Math.abs(d); m += d; k++;
  }
  return k ? s / k - Math.abs(m / k) * .5 : 0;
}
// mean luminance of the background (frame edges away from the face) — exposure reference when the camera can't be locked
function bgLevel(img, pose){
  const {data, width:w, height:h} = img, s = Math.max(4, Math.round(w * .06));
  const spots = [[0, 0], [w - s, 0], [0, Math.round(h * .45)], [w - s, Math.round(h * .45)]];
  const vals = [];
  spots.forEach(([x0, y0]) => {
    if(pose && Math.abs(x0 + s / 2 - pose.cx) < pose.fw * .8 && Math.abs(y0 + s / 2 - pose.cy) < pose.fh * .8) return;
    let Y = 0, n = 0;
    for(let y = y0; y < y0 + s; y += 2) for(let x = x0; x < x0 + s; x += 2){
      const i = (y * w + x) * 4; Y += .2126 * SRGB_LIN[data[i]] + .7152 * SRGB_LIN[data[i + 1]] + .0722 * SRGB_LIN[data[i + 2]]; n++;
    }
    vals.push(Y / n);
  });
  const v = median(vals);
  return v > .02 && v < .95 ? v : null;
}
// lock exposure + white balance once settled, so the camera can't "undo" the white cast it sees
async function lockCamera(track){
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const cur = track.getSettings ? track.getSettings() : {};
    const adv = {};
    if(caps.exposureMode && caps.exposureMode.includes('manual')){ adv.exposureMode = 'manual'; if(cur.exposureTime) adv.exposureTime = cur.exposureTime; }
    if(caps.whiteBalanceMode && caps.whiteBalanceMode.includes('manual')){ adv.whiteBalanceMode = 'manual'; if(cur.colorTemperature) adv.colorTemperature = cur.colorTemperature; }
    if(!Object.keys(adv).length) return false;
    await track.applyConstraints({advanced:[adv]});
    return true;
  }catch(e){ return false; }
}

// ---- fade model ----
function localHourKey(d){
  const p = v => String(v).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:00`;
}
function uvAt(ms, L){
  const d = new Date(ms);
  const H = (ui.weather.status === 'ready' && ui.weather.hourly) || L.hourly;
  if(H){ const i = H.time.indexOf(localHourKey(d)); if(i >= 0 && H.uv[i] != null) return H.uv[i]; }
  // no forecast for that hour: daylight curve peaking at today's max (or a typical 6)
  const peak = L.uvMax != null ? L.uvMax : 6;
  const h = d.getHours() + d.getMinutes() / 60;
  return Math.max(0, peak * Math.sin(Math.PI * (h - 6) / 13));
}
function outdoorAt(ms, L){
  let o = true;
  for(const s of L.segs) if(s.from <= ms) o = s.outdoor;
  return o;
}
function decayPerMin(L, key, ms){
  const z = SPF_AR_ZONES.find(x => x.key === key);
  const uv = uvAt(ms, L) * (outdoorAt(ms, L) ? 1 : 0.08);   // glass + shade indoors
  return SPF_DECAY.base + SPF_DECAY.uv * z.expo * uv;
}
function zoneProtection(L, key, at){
  const z = L.zones[key];
  if(!z) return 0;
  let k = 0;
  for(let t = L.at; t < at; t += 300000) k += Math.min(5, (at - t) / 60000) * decayPerMin(L, key, t);
  const amount = L.amount === 'no' ? .6 : 1;
  return clamp(100 * z.q * amount * Math.pow(.88, z.rubs || 0) * Math.exp(-k), 0, 100);
}
// minutes from now until the zone drops under the "weak" line (null if > 12h)
function minutesUntilWeak(L, key){
  let p = zoneProtection(L, key, Date.now());
  if(p < PROT_WEAK) return 0;
  for(let m = 5, t = Date.now(); m <= 720; m += 5, t += 300000){
    p *= Math.exp(-5 * decayPerMin(L, key, t));
    if(p < PROT_WEAK) return m;
  }
  return null;
}
function fmtMins(m){ return m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}` : `${m} min`; }

/* ---------------------------------------------------------
   SUNSCREEN CHECK REPORTS
   Kept on this device for as long as the browser allows: IndexedDB (primary) plus a
   localStorage mirror (each heals the other on load), and persistent-storage mode so
   the browser won't evict them when space runs low. A backup file covers the rest
   (cleared site data, a new phone).
--------------------------------------------------------- */
const REPORT_KEY = 'myskin:spfReports';
const REPORT_MAX = 300;
const reports = {list:[], persisted:null, all:false};
let idbPromise = null;
function idb(){
  if(!idbPromise) idbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('myskin', 3);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains('spfReports')) db.createObjectStore('spfReports', {keyPath:'id'});
      if(!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', {keyPath:'id'});
      if(!db.objectStoreNames.contains('analyses')) db.createObjectStore('analyses', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }).catch(e => { idbPromise = null; throw e; });
  return idbPromise;
}
async function idbDo(mode, fn, store = 'spfReports'){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode), q = fn(tx.objectStore(store));
    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error);
  });
}
function mirrorReports(){ try{ localStorage.setItem(REPORT_KEY, JSON.stringify(reports.list.slice(0, REPORT_MAX))); }catch(e){} }
async function loadReports(){
  let ls = [], db = [];
  try{ ls = JSON.parse(localStorage.getItem(REPORT_KEY)) || []; }catch(e){}
  try{ db = await idbDo('readonly', s => s.getAll()) || []; }catch(e){}
  const byId = new Map();
  [...ls, ...db].forEach(r => { if(r && r.id) byId.set(r.id, r); });
  reports.list = [...byId.values()].sort((a, b) => b.at - a.at).slice(0, REPORT_MAX);
  const inDb = new Set(db.map(r => r.id));
  reports.list.filter(r => !inDb.has(r.id)).forEach(r => idbDo('readwrite', s => s.put(r)).catch(() => {}));
  mirrorReports();
  try{ if(navigator.storage && navigator.storage.persisted) reports.persisted = await navigator.storage.persisted(); }catch(e){}
  refreshReports();
}
async function storeReports(list){
  const known = new Set(reports.list.map(r => r.id));
  list.forEach(r => { if(!known.has(r.id)) reports.list.push(r); });
  reports.list.sort((a, b) => b.at - a.at);
  reports.list = reports.list.slice(0, REPORT_MAX);
  mirrorReports();
  for(const r of list) await idbDo('readwrite', s => s.put(r)).catch(() => {});
  // ask once to be exempt from automatic eviction (granted silently on most installed / often-used sites)
  try{ if(!reports.persisted && navigator.storage && navigator.storage.persist) reports.persisted = await navigator.storage.persist(); }catch(e){}
  refreshReports();
}
async function deleteReport(id){
  reports.list = reports.list.filter(r => r.id !== id);
  mirrorReports();
  await idbDo('readwrite', s => s.delete(id)).catch(() => {});
  refreshReports();
}
async function clearReports(){
  reports.list = [];
  try{ localStorage.removeItem(REPORT_KEY); }catch(e){}
  await idbDo('readwrite', s => s.clear()).catch(() => {});
}

function buildSpfReport(L){
  const w = ui.weather.status === 'ready' ? ui.weather : null;
  const zones = SPF_AR_ZONES.map(z => {
    const r = L.zones[z.key], m = r.m || {};
    return {key:z.key, name:z.name, status:r.status, start:Math.round(zoneProtection(L, z.key, L.at)), weakIn:minutesUntilWeak(L, z.key),
      coverage: m.coverage != null ? Math.round(m.coverage * 100) : null,
      points: m.cov ? m.cov.length : null, missed: m.cov ? m.cov.filter(v => !v).length : null,
      dE:m.dE ?? null, dL:m.dL ?? null, dC:m.dC ?? null, dSpec:m.dSpec ?? null};
  });
  const weakest = zones.reduce((a, b) => b.start < a.start ? b : a);
  const weakIns = zones.map(z => z.weakIn).filter(v => v != null);
  return {id:'spf-' + L.at, v:1, at:L.at, spf:L.spf, spfGuess:L.spfGuess, amount:L.amount,
    uv:Math.round(uvAt(L.at, L) * 10) / 10, uvMax:L.uvMax, uvLive:L.uvLive, place:w ? w.place : '', temp:w ? w.temp : null,
    tracked:!L.approx, locked:L.locked, zones, avg:Math.round(mean(zones.map(z => z.start))),
    weakest:weakest.name, reapplyIn:weakIns.length ? Math.min(...weakIns) : null};
}
const fmtWhen = at => new Date(at).toLocaleString(I18N.locale, {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
function reportTips(r){
  const tips = [];
  const missed = r.zones.filter(z => z.missed);
  if(missed.length) tips.push(`Missed spots on ${missed.map(z => `${z.name} (${z.missed}/${z.points})`).join(', ')} — spread more slowly over those areas next time.`);
  const unverified = r.zones.filter(z => z.status === 'manual' || z.status === 'motion');
  if(unverified.length) tips.push(`${unverified.map(z => z.name).join(', ')} could not be confirmed by colour — a tinted or white-cast sunscreen makes the check more reliable.`);
  if(r.amount === 'no') tips.push('You used less than two finger-lengths, which lowers real protection a lot.');
  if(r.spfGuess) tips.push('SPF was not selected, so SPF 30 was assumed.');
  else if(r.spf < 30) tips.push('SPF 15 is not enough for daily exposure — use at least SPF 30.');
  if(r.reapplyIn != null) tips.push(`Modelled protection on ${r.weakest} dropped below ${PROT_WEAK}% about ${fmtMins(r.reapplyIn)} after applying (outdoors).`);
  if(!r.tracked) tips.push('Measured without face tracking, so this report is less accurate.');
  return tips;
}
